<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pac-Man 3D</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        pointer-events: none;
        z-index: 100;
      }
      .hud-item {
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      }
      @media (max-width: 768px) {
        .hud-item {
          font-size: 14px;
        }
        #hud-overlay {
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="hud-overlay">
        <div id="hud-score" class="hud-item">Score: 0</div>
        <div id="hud-lives" class="hud-item">Lives: 3</div>
        <div id="hud-level" class="hud-item">Level: 1</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
